limit_req_zone $binary_remote_addr zone=ratelimit:10m rate=5r/s;

# Recebe tráfego na porta 80 e redireciona para HTTPS
server {
    listen 80;
    server_name vaiabastecendo.lucsdsm.com.br;

    # Usado pelo Certbot para validar o domínio
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Recebe o tráfego HTTPS (entregue pelo SSLH na porta interna 443 do container)
server {
    listen 443 ssl;
    server_name vaiabastecendo.lucsdsm.com.br;

    ssl_certificate /etc/letsencrypt/live/vaiabastecendo.lucsdsm.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vaiabastecendo.lucsdsm.com.br/privkey.pem;

    limit_req zone=ratelimit burst=10 nodelay;

    # Se alguém pedir arquivos ocultos (que começam com ponto, tipo .env, .git, etc) ou arquivos de configuração
    # ou arquivos de backup o Nginx recusa na hora e não avisa o Django.
    location ~* (/\.env|/\.git|/config\.json|/backup|/\.well-known|wp-|xmlrpc\.php|\.php) {
        deny all;
        access_log off;     # Não suja o log de acesso do Nginx
        log_not_found off;  # Não suja o log de erro do Nginx
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
