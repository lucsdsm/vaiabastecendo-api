limit_req_zone $binary_remote_addr zone=api_ratelimit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_ratelimit:10m rate=10r/m;

limit_conn_zone $binary_remote_addr zone=per_ip_connections:10m;

map $http_user_agent $blocked_user_agent {
    default 0;

    ~*zgrab 1;
    ~*flowiqlabsbot 1;
    ~*visionheight\.com/scan 1;

    ~*sqlmap 1;
    ~*nikto 1;
    ~*nmap 1;
    ~*masscan 1;
    ~*zmap 1;
    ~*nuclei 1;
    ~*openvas 1;
    ~*nessus 1;
    ~*acunetix 1;
    ~*netsparker 1;
    ~*dirbuster 1;
    ~*gobuster 1;
    ~*ffuf 1;
    ~*wpscan 1;
    ~*whatweb 1;
}

# HTTP: somente Certbot e redirecionamento para HTTPS.
server {
    listen 80;
    server_name vaiabastecendo.lucsdsm.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: filtro e proxy da API.
server {
    listen 8443 ssl;
    server_name vaiabastecendo.lucsdsm.com.br;

    ssl_certificate /etc/letsencrypt/live/vaiabastecendo.lucsdsm.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vaiabastecendo.lucsdsm.com.br/privkey.pem;

    server_tokens off;
    client_max_body_size 2m;

    if ($blocked_user_agent) {
        return 444;
    }

    location ~* (/\.env|/\.git|/config\.json|/backup|wp-|xmlrpc\.php|\.php) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ^~ /admin/ {
        limit_req zone=auth_ratelimit burst=10 nodelay;
        limit_conn per_ip_connections 5;

        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location ^~ /api/ {
        limit_req zone=api_ratelimit burst=30 nodelay;
        limit_conn per_ip_connections 15;

        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location ^~ /static/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        return 404;
    }
}